# SPDX-License-Identifier: Apache-2.0
# The openftgs-xr workspace (§2.1). Every version of §2.3 is pinned once, in
# `[workspace.dependencies]` below (D-1); a crate adds a dependency with
# `<name>.workspace = true` in the milestone that first uses it.

[workspace]
resolver = "3"
# Q-139: the vendored crate is a patch, not a member.
exclude = ["vendor"]
members = [
    "crates/ftgsxr-core",
    "crates/ftgsxr-io",
    "crates/ftgsxr-render",
    "crates/ftgsxr-app",
    "crates/ftgsxr-xr",
    "crates/ftgsxr-desktop",
    "crates/ftgsxr-quest",
    "crates/ftgsxr-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Bevy 0.19.1's minimum (§2.6; source log 1).
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/samaust/openftgs-xr"
publish = false

# The pin table of §2.3, applied by the pin rule D-1 (Bevy 0.19.1 on 2026-10-29).
# Rows marked "Bevy's pin" or "the XR crates' pin" in §2.3 carry the version
# those crates require (source log 2 to 5), so a direct use never
# duplicates the engine's copy. Default features are off where they would make
# a choice for the crate that uses the dependency (Bevy's render features,
# rustls's crypto provider under D-20, image's codecs); that crate turns on
# what it needs.
[workspace.dependencies]
# The workspace's own crates (§2.1).
ftgsxr-core = { path = "crates/ftgsxr-core" }
ftgsxr-io = { path = "crates/ftgsxr-io" }
ftgsxr-render = { path = "crates/ftgsxr-render" }
ftgsxr-app = { path = "crates/ftgsxr-app" }
ftgsxr-xr = { path = "crates/ftgsxr-xr" }
ftgsxr-testkit = { path = "crates/ftgsxr-testkit" }

# Engine.
bevy = { version = "0.19.1", default-features = false }
# Default features off: they choose backends (dx12, metal, gles, webgpu) for the crate
# that uses wgpu, which turns on what it needs (Q-73).
wgpu = { version = "29.0.3", default-features = false }
wgpu-hal = "29.0.3"
naga = "29.0.3"
# bevy_math 0.19.1 requires glam ^0.32.0 (source log 2); §2.3's "(0.33)" is
# superseded by its own rule "Bevy's pin" (D-1, PRD #1).
glam = "0.32"
# Q-243: default features off, as Bevy takes winit; the crate that uses winit turns on
# its platforms (#401).
winit = { version = "0.30", default-features = false }

# XR.
bevy_mod_openxr = "0.6.0"
bevy_mod_xr = "0.6.0"
openxr = "0.21.1"
openxr-sys = "0.13.1"

# Foundation.
safetensors = "0.8"
memmap2 = "0.9"
bytemuck = "1.25"
half = "2.7"
serde = "1"
serde_json = "1"
toml = "1.1"
sha2 = "0.10"
thiserror = "2"
rayon = "1"
# D-20: default features off (no gzip, which would break byte-offset resumes); the
# crate that uses ureq enables `rustls` (ring and webpki-roots).
ureq = { version = "3.5", default-features = false }
# D-20: the `ring` provider, chosen by the crate that uses rustls.
rustls = { version = "0.23", default-features = false }
ring = "0.17"
webpki-roots = "1.0"
url = "2"
directories = "6"
tracing = "0.1"
tracing-subscriber = "0.3"

# Application and desktop.
# Default features off: `ftgsxr-app` turns on `render` alone (PRD #275).
bevy_egui = { version = "0.42", default-features = false }
egui = "0.36"
# Default features off: `ftgsxr-app` turns on the four formats of §1.10 (Q-149).
bevy_kira_audio = { version = "0.26", default-features = false }
# Default features off, as bevy_kira_audio takes it: the cpal backend without the realtime
# D-Bus feature (Q-187).
kira = { version = "0.12.1", default-features = false, features = ["cpal"] }
image = { version = "0.25", default-features = false }
clap = "4"
rfd = "0.17"

# Quest.
android-activity = "=0.6.0"
android_logger = "0.15"
jni = "0.20"
ndk-context = "0.1"

# Dev.
proptest = "1"
approx = "0.5"
tiny_http = "0.12"

# Q-139: bevy_mod_openxr 0.6.0 vendored with two changes, both Android only, in
# vendor/bevy_mod_openxr-0.6.0/src/openxr/graphics/vulkan.rs (the Vulkan target; the
# instance drops wgpu's VALIDATION_INDIRECT_CALL, D-30), approved by the owner.
[patch.crates-io]
bevy_mod_openxr = { path = "vendor/bevy_mod_openxr-0.6.0" }
# D-30: wgpu-core 29.0.4 vendored with one change (src/instance.rs, an instance made
# from a Vulkan HAL instance keeps its flags). Q-243: and a second (src/present.rs and
# src/track/texture.rs, a surface texture presented with no submission having used it is
# cleared and submitted first, #401), approved by the owner.
wgpu-core = { path = "vendor/wgpu-core-29.0.4" }
# D-30: wgpu-hal 29.0.4 vendored with one change (src/vulkan/instance.rs, a `flags()`
# getter on the Vulkan instance).
wgpu-hal = { path = "vendor/wgpu-hal-29.0.4" }

# Q-140: the dv lane's debug APK: the dev profile's debug assertions (and so the
# validation of §1.13), optimised so Dv-2 can hold 72 Hz.
[profile.dv]
inherits = "dev"
opt-level = 3
debug-assertions = true
