# SPDX-License-Identifier: Apache-2.0
[package]
name = "ftgsxr-io"
description = "openftgs-xr foundation: paths, settings, scene and pose files, listings, HTTP and model sources (§2.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[dependencies]
ftgsxr-core.workspace = true
directories.workspace = true
# The player's `index.json` and nginx's JSON listing (§1.5, §1.11).
serde_json.workspace = true
# The download cache's digests (§1.5).
sha2.workspace = true
thiserror.workspace = true
# The `TlsRoots::Platform` fallback's warning (Q-5).
tracing.workspace = true
# HTTP listings and downloads over rustls with the `ring` provider and webpki-roots (D-20).
ureq = { workspace = true, features = ["rustls"] }
# The listings' URLs (§1.5).
url.workspace = true

[dev-dependencies]
ftgsxr-testkit.workspace = true
