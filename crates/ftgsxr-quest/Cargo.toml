# SPDX-License-Identifier: Apache-2.0
[package]
name = "ftgsxr-quest"
description = "openftgs-xr Meta Quest 3 entry point, the library libftgsxr_quest.so (§2.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "ftgsxr_quest"
crate-type = ["cdylib"]

# M-3 (#222): §2.1's row. The Android crates only under the Android target, so the crate
# builds empty on the host (§2.7's host checks).
[dependencies]
ftgsxr-app.workspace = true
ftgsxr-xr.workspace = true
# Also here, featureless, for Bevy's derive macros, which find the crate in this table.
bevy.workspace = true

# #224: Bevy for `#[bevy_main]` and its winit runner on GameActivity (D-18; the XR crate
# forces neither backend), bevy_mod_xr for the session state (§2.1); tracing's `log`
# feature hands the events to android_logger (§1.13, no Bevy `LogPlugin` on the Quest).
# #539: `bevy_gizmos_render` draws the gizmo lines `ftgsxr-xr` queues, the rays and their
# dot (§1.8 Rays) and the teleport arc (§1.8 Locomotion), and manipulate's boxes (§1.4).
[target.'cfg(target_os = "android")'.dependencies]
android-activity.workspace = true
android_logger.workspace = true
bevy = { workspace = true, features = [
    "std",
    "multi_threaded",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_window",
    "bevy_winit",
    "android-game-activity",
    "bevy_gizmos_render",
] }
bevy_mod_xr.workspace = true
jni.workspace = true
ndk-context.workspace = true
# §2.1
tracing = { workspace = true, features = ["log"] }

# #660: the E-XR-RUNTIME exit's tests on the host, the session's message and reference
# space from bevy_mod_xr (§2.1), and the `gpu_` variant's render half (as `ftgsxr-app`'s
# test support adds it) and layer guard (R-16).
[dev-dependencies]
bevy = { workspace = true, features = ["bevy_core_pipeline", "multi_threaded"] }
bevy_mod_xr.workspace = true
ftgsxr-testkit.workspace = true
