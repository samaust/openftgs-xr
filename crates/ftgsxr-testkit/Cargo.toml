# SPDX-License-Identifier: Apache-2.0
[package]
name = "ftgsxr-testkit"
description = "openftgs-xr test kit: fixtures, checksums, image metrics and synthetic models (§2.1, §2.7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The workspace crates of §2.1's band table: `ftgsxr-core`, and `ftgsxr-render` for
# `gpu_context` (M-2, Q-1); image joins when a helper needs it. sha2 (the fixtures'
# checksums), serde_json (the safetensors headers the builder writes) and tiny_http (the
# fixture server, §2.3's dev row) are §2.3 crates.
[dependencies]
ftgsxr-core.workspace = true
ftgsxr-render.workspace = true
serde_json.workspace = true
sha2.workspace = true
tiny_http.workspace = true
# Q-105: the Vulkan validation layer's messages, which wgpu-hal logs through `log`
# (tracing-subscriber's default `tracing-log` bridge), for R-16.
tracing.workspace = true # Q-106
tracing-subscriber.workspace = true # Q-106

[dev-dependencies]
approx.workspace = true
# The independent reader the builder's output is checked against (§2.3's `ftgs-if` reader crate).
safetensors.workspace = true
