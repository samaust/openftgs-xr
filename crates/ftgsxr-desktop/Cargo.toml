# SPDX-License-Identifier: Apache-2.0
[package]
name = "ftgsxr-desktop"
description = "openftgs-xr Linux player and command line, the binary ftgsxr (§2.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ftgsxr"
path = "src/main.rs"

# M-2 (#117): the headless commands that need no GPU. `ftgsxr-xr` (feature `xr`) and rfd
# join with `play` in M-4. clap's builder API, so no derive macro is needed.
[dependencies]
clap.workspace = true
ftgsxr-app.workspace = true

[dev-dependencies]
ftgsxr-testkit.workspace = true
# An independent reader of the benchmark files `bench` writes (#122, Q-103), as
# `ftgsxr-render` reads its fixture pose files.
serde_json.workspace = true
