# SPDX-License-Identifier: Apache-2.0
[package]
name = "ftgsxr-desktop"
description = "openftgs-xr Linux player and command line, the binary ftgsxr (§2.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ftgsxr"
path = "src/main.rs"

# M-2 (#117): the headless commands that need no GPU. clap's builder API, so no derive
# macro is needed. M-4 (#277): `play` takes bevy for `DefaultPlugins` and the window
# (Q-154: winit with X11 and Wayland), rfd's dialogs with its defaults (Q-160: the XDG
# portal) and `ftgsxr-xr` under the feature `xr`, on by default (§2.1).
[features]
default = ["xr"]
xr = ["dep:ftgsxr-xr"]

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "multi_threaded",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
] } # Q-154
clap.workspace = true
ftgsxr-app.workspace = true
ftgsxr-xr = { workspace = true, optional = true }
rfd.workspace = true # Q-160

[dev-dependencies]
ftgsxr-testkit.workspace = true
# An independent reader of the benchmark files `bench` writes (#122, Q-103), as
# `ftgsxr-render` reads its fixture pose files.
serde_json.workspace = true # Q-104
