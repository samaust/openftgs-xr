# SPDX-License-Identifier: Apache-2.0
[package]
name = "ftgsxr-app"
description = "openftgs-xr application: everything the desktop and Quest builds share (§2.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


# M-2: the headless commands need the core (#117) and the render layer's headless renderer
# for `render` (#118); `bench` (#122) drives the render layer's passes through Bevy's
# re-exported wgpu descriptors (`bevy_render`) and clears the layer with `bevy_color`'s
# wgpu conversion; it logs through `bevy_log`'s `tracing` (§2.6, #189, #193). The other crates of §2.1's row join with the modules that use them.
[dependencies]
# #282: `manipulate` draws its boxes and gizmo with Bevy's gizmo lines (PRD #275).
# #289: B-9 builds the desktop's render plugins without a window (`bevy_core_pipeline`).
bevy = { workspace = true, features = ["bevy_render", "bevy_color", "bevy_log", "bevy_gizmos", "bevy_pbr", "bevy_core_pipeline"] }
ftgsxr-core.workspace = true
ftgsxr-io.workspace = true # Q-127: `SettingsRes` holds `ftgsxr_io::Settings`
ftgsxr-render.workspace = true
# M-4 (#277): the UI (§2.3; `render` alone, PRD #275), screenshots' PNG, and the desktop
# log (Q-151).
bevy_egui = { workspace = true, features = ["render"] }
image = { workspace = true, features = ["png"] }
tracing-subscriber.workspace = true # Q-151

[dev-dependencies]
# #277: the test support's `gpu_` variant adds the camera and pipeline plugins, as
# `ftgsxr-render`'s adapter tests do.
bevy = { workspace = true, features = ["bevy_core_pipeline"] }
ftgsxr-testkit.workspace = true
# An independent reader of the benchmark files `bench` writes (#122, Q-103), as
# `ftgsxr-render` reads its fixture pose files.
serde_json.workspace = true # Q-104

# M-4 (#277): the audio of §1.10's four formats (Q-149; `mp3` brings symphonia's MPL-2.0
# crates, unmodified). Not on Android until M-5 (PRD #275's spike check 3 and its
# fallback): kira's cpal backend links AAudio, which the CI Quest build's `cargo ndk`
# (API level 21 by default) cannot find.
[target.'cfg(not(target_os = "android"))'.dependencies]
bevy_kira_audio = { workspace = true, features = ["ogg", "wav", "flac", "mp3"] }
# Q-187: the adapter drives kira (§2.3's row under bevy_kira_audio, at its pin) itself, since
# bevy_kira_audio keeps its `AudioManager` crate-private and only logs a missing device;
# bevy_kira_audio's features above choose kira's decoders.
kira.workspace = true # Q-187
