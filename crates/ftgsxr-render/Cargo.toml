# SPDX-License-Identifier: Apache-2.0
[package]
name = "ftgsxr-render"
description = "openftgs-xr engine: the wgpu render layer and its Bevy plugin adapter (§2.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


# Bevy's render layer (§2.1 band table); `bevy_log` for the crate's logging (§2.6).
# wgpu itself for the types Bevy 0.19.1 does not re-export (`Instance`, `Adapter`,
# `Device`, `Queue`, `wgpu::hal`): the same pin as Bevy's, one copy in the graph (Q-T111.1).
[dependencies]
bevy = { workspace = true, features = ["bevy_render", "bevy_log"] }
ftgsxr-core.workspace = true
wgpu = { workspace = true, features = ["vulkan", "wgsl"] }

[dev-dependencies]
ftgsxr-testkit.workspace = true
