# SPDX-License-Identifier: Apache-2.0
[package]
name = "ftgsxr-xr"
description = "openftgs-xr XR: the OpenXR session, tracking, passthrough, depth, light, anchors and the panel (§2.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# #413: one integration-test binary, whose modules are the `tests/*.rs` files
# (`tests/integration.rs`), not one executable per file.
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"


# M-3 (#222): the XR crates of §2.1's row and §2.3, and the app for `Permission` (§2.1's
# `XrError::Permission`). bevy_mod_openxr's default feature `vulkan` is the backend both
# builds use (§2.4); `fb_passthrough` and the other features join with their modules.
# #223: bevy (the render features, as `ftgsxr-render`), the io crate for `XrSettings` and
# the render crate for `SplatCamera`.
# #227: the core crate for `Pose` (`TrackedHand`, `XrHands`).
[dependencies]
# #454: `bevy_pbr` for the hand capsules, the controller meshes, the rays and the panel's
# quad (PRD #452), as Q-154's precedent allows a band row's features.
# #460: `bevy_gizmos` and `bevy_color` for `xr_input`'s rays and teleport arc, as
# `ftgsxr-app` has them (Q-154's precedent).
# §2.1
bevy = { workspace = true, features = ["bevy_render", "bevy_core_pipeline", "bevy_log", "bevy_pbr", "bevy_gizmos", "bevy_color"] }
bevy_mod_openxr.workspace = true
bevy_mod_xr.workspace = true
ftgsxr-app.workspace = true
ftgsxr-core.workspace = true
ftgsxr-io.workspace = true
ftgsxr-render.workspace = true
openxr.workspace = true

# #223: the `xr` tests capture the log (I-15's "no error-level log", I-17's warning) with
# a tracing subscriber of their own, as Q-106's `layer_messages` does; the testkit and the
# probe fixtures for the model I-15 draws.
[dev-dependencies]
# #225: Dv-2's pixel check decodes the headset's screenshot (PNG). Q-141
image = { workspace = true, features = ["png"] }
ftgsxr-testkit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
