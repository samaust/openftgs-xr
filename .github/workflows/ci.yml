# SPDX-License-Identifier: Apache-2.0
# Continuous integration on every push (§2.7): formatting, clippy, cargo-deny, the
# `cpu` lane and the skeleton test. The other lanes (`gpu`, `xr`, `dv`, `net`, `ds`)
# are `#[ignore]`d (D-28) and run on the owner's machine, not here.
name: ci

on:
  push:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  cpu:
    name: cpu lane
    runs-on: ubuntu-latest
    # The build settings of every cargo command here that builds the workspace (clippy,
    # the `cpu lane` and the skeleton test), sized for the standard runner's 14 GB disk:
    # no debug info and no incremental data (the first two variables below), and
    # packages that aren't workspace members (bevy, wgpu, naga and the rest) at
    # opt-level 1, through `--config "$CARGO_DEPS_OPT_LEVEL"` (cargo's `"*"` package
    # override) on each of those commands. The workspace's own crates keep the dev
    # profile's opt-level. The `target` directory is not cached: every push builds from
    # scratch, with no stale build on the disk and no multi-gigabyte restore. Owner's
    # decisions of 2026-11-03 (#411); they live here, not in `Cargo.toml` or
    # `.cargo/config.toml`, so local builds and `[profile.dv]` (Q-140) are unchanged.
    # Don't revert them without asking.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_DEPS_OPT_LEVEL: 'profile.dev.package."*".opt-level=1'
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      # The Linux build's system libraries, before any step compiles dependencies: on
      # Linux, ftgsxr-app's audio (kira → cpal → alsa → alsa-sys; Q-187) links ALSA,
      # which alsa-sys's build script finds with pkg-config (#410). No other build
      # script links a system library beyond libc's libdl; the window system and
      # Vulkan libraries are loaded at run time.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-${{ runner.os }}-

      # The disk budget as a number in every run's log, before the first cargo command
      # and after the `cpu lane` step (#411).
      - name: free disk before the build
        run: df -h "$GITHUB_WORKSPACE"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo --config "$CARGO_DEPS_OPT_LEVEL" clippy --workspace --all-targets -- -D warnings

      - name: cargo deny check
        run: |
          command -v cargo-deny || cargo install --locked cargo-deny
          cargo deny check

      # One run of the lane, on bevy's `multi_threaded` task pools only, as the desktop
      # and Quest builds use them (§2.4 Threads): the workspace build unifies the
      # feature into every crate's tests, and ftgsxr-app's dev-dependency sets it too
      # (#291). There is no single-threaded run, by the owner's decision (2026-11-03,
      # #412): it saves CI time and disk.
      - name: cpu lane
        id: cpu-lane
        run: cargo --config "$CARGO_DEPS_OPT_LEVEL" test --workspace

      - name: free disk after the cpu lane
        if: ${{ !cancelled() && steps.cpu-lane.outcome != 'skipped' }}
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh target || true

      - name: skeleton test
        run: cargo --config "$CARGO_DEPS_OPT_LEVEL" test -p ftgsxr-core skeleton

  # The Quest build (§2.7): `cargo ndk` with the Android NDK, without Gradle, to catch
  # compile breaks of `ftgsxr-quest` (#224). NDK 25.1.8937393 (§2.5), installed with the
  # runner's sdkmanager.
  quest:
    name: quest build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.1.8937393" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-

      - name: cargo ndk
        run: |
          command -v cargo-ndk || cargo install --locked cargo-ndk --version ^4.1
          # `-P 32`: the NDK platform at minSdk 32 (D-18), owner 2026-11-02 (#275).
          cargo ndk -t arm64-v8a -P 32 build --release -p ftgsxr-quest
