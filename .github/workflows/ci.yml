# SPDX-License-Identifier: Apache-2.0
# Continuous integration on every push (§2.7): formatting, clippy, cargo-deny, the
# `cpu` lane and the skeleton test. The other lanes (`gpu`, `xr`, `dv`, `net`, `ds`)
# are `#[ignore]`d (D-28) and run on the owner's machine, not here.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  cpu:
    name: cpu lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo deny check
        run: |
          command -v cargo-deny || cargo install --locked cargo-deny
          cargo deny check

      - name: cpu lane
        run: cargo test --workspace

      - name: skeleton test
        run: cargo test -p ftgsxr-core skeleton

  # The Quest build (`cargo ndk` with the Android NDK, without Gradle, §2.7) joins in
  # M-3, with `android/` and `ftgsxr-quest`'s entry point:
