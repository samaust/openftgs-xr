# SPDX-License-Identifier: Apache-2.0
# Continuous integration on every push (§2.7): formatting, clippy, cargo-deny, the
# `cpu` lane and the skeleton test. The other lanes (`gpu`, `xr`, `dv`, `net`, `ds`)
# are `#[ignore]`d (D-28) and run on the owner's machine, not here.
name: ci

on:
  push:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  cpu:
    name: cpu lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      # The Linux build's system libraries, before any step compiles dependencies: on
      # Linux, ftgsxr-app's audio (kira → cpal → alsa → alsa-sys; Q-187) links ALSA,
      # which alsa-sys's build script finds with pkg-config (#410). No other build
      # script links a system library beyond libc's libdl; the window system and
      # Vulkan libraries are loaded at run time.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo deny check
        run: |
          command -v cargo-deny || cargo install --locked cargo-deny
          cargo deny check

      # One run of the lane, on bevy's `multi_threaded` task pools only, as the desktop
      # and Quest builds use them (§2.4 Threads): the workspace build unifies the
      # feature into every crate's tests, and ftgsxr-app's dev-dependency sets it too
      # (#291). There is no single-threaded run, by the owner's decision (2026-11-03,
      # #412): it saves CI time and disk.
      - name: cpu lane
        run: cargo test --workspace

      - name: skeleton test
        run: cargo test -p ftgsxr-core skeleton

  # The Quest build (§2.7): `cargo ndk` with the Android NDK, without Gradle, to catch
  # compile breaks of `ftgsxr-quest` (#224). NDK 25.1.8937393 (§2.5), installed with the
  # runner's sdkmanager.
  quest:
    name: quest build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.1.8937393" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-

      - name: cargo ndk
        run: |
          command -v cargo-ndk || cargo install --locked cargo-ndk --version ^4.1
          # `-P 32`: the NDK platform at minSdk 32 (D-18), owner 2026-11-02 (#275).
          cargo ndk -t arm64-v8a -P 32 build --release -p ftgsxr-quest
