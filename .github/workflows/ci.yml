# SPDX-License-Identifier: Apache-2.0
# Continuous integration on every push (§2.7): formatting, clippy, cargo-deny, the
# `cpu` lane and the skeleton test. The other lanes (`gpu`, `xr`, `dv`, `net`, `ds`)
# are `#[ignore]`d (D-28) and run on the owner's machine, not here.
name: ci

on:
  push:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  cpu:
    name: cpu lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo deny check
        run: |
          command -v cargo-deny || cargo install --locked cargo-deny
          cargo deny check

      - name: cpu lane
        run: cargo test --workspace

      # The workspace run unifies bevy's `multi_threaded` (ftgsxr-desktop's) into the
      # app's tests; alone, ftgsxr-app's tests run on single-threaded task pools. Both
      # executors run them, so a system order only one of them happens to give is
      # caught (§2.4 Threads, #279).
      - name: cpu lane, app without multi_threaded
        run: cargo test -p ftgsxr-app

      - name: skeleton test
        run: cargo test -p ftgsxr-core skeleton

  # The Quest build (§2.7): `cargo ndk` with the Android NDK, without Gradle, to catch
  # compile breaks of `ftgsxr-quest` (#224). NDK 25.1.8937393 (§2.5), installed with the
  # runner's sdkmanager.
  quest:
    name: quest build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.1.8937393" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-

      - name: cargo ndk
        run: |
          command -v cargo-ndk || cargo install --locked cargo-ndk --version ^4.1
          cargo ndk -t arm64-v8a build --release -p ftgsxr-quest
