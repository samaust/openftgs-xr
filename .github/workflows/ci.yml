  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: rustup target add aarch64-linux-android
  #     - run: cargo install --locked cargo-ndk
  #     - run: cargo ndk -t arm64-v8a build --release -p ftgsxr-quest
